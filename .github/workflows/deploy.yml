name: Deploy Worker

# On every push to main: run the tests, let semantic-release (.releaserc.json)
# read the Conventional Commits since the last vX.Y.Z tag, then deploy.
# feat → minor, fix/perf/revert/deps → patch, `!` or BREAKING CHANGE → major,
# anything else → no release. A release creates the vX.Y.Z tag and a GitHub
# Release. Nothing is committed to main. The deploy always runs and bakes the
# version (git describe) into the Worker as APP_VERSION.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag and create the GitHub Release
    concurrency:
      group: flighty-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history and tags

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # "0.4.0" right after a release, "0.4.0-3-gabc1234" for unreleased commits.
      - name: Version
        id: version
        run: echo "version=$(git describe --tags --always | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply flighty-mcp --remote

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --var APP_VERSION:${{ steps.version.outputs.version }}

      # MCP_TOKEN is no longer an auth path. Deleting a secret publishes a new
      # version; a missing secret is already gone, so do not fail the deploy.
      - name: Remove legacy MCP bearer secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler secret delete MCP_TOKEN || echo "MCP_TOKEN was already absent"
