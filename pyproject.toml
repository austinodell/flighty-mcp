[project]
name = "flighty-mcp"
version = "0.1.0"
description = "Unofficial MCP server for Flighty flight tracking"
readme = "README.md"
license = "MIT"
authors = [{name = "swiftyspiffy"}]
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "httpx>=0.28,<1", "protobuf>=6.33,<8", "websockets>=15,<17"]
keywords = ["mcp", "flighty", "flights", "flight-tracking"]

[project.urls]
Homepage = "https://github.com/swiftyspiffy/flighty-mcp"
Issues = "https://github.com/swiftyspiffy/flighty-mcp/issues"

[project.scripts]
flighty-mcp = "flighty_mcp.server:main"
flighty-token = "flighty_mcp.token:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flighty_mcp"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "pytest-cov>=6", "respx>=0.23", "ruff>=0.14", "mypy>=1.18", "build>=1.3", "types-protobuf>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["google.protobuf.*", "websockets.*"]
ignore_missing_imports = true
